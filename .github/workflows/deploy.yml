name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: write the Pages site with an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels a build that is still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prints which values the build will inline, never the values themselves.
      # Secrets are read from Settings → Secrets and variables → Actions → Secrets;
      # entries in the Variables tab, or in an environment's secrets, never reach
      # this job and show up here as empty.
      - name: Check the Firebase values reached the build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_APPCHECK_SITE_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::notice title=$name::present (${#value} characters)"
            else
              echo "::warning title=$name::empty in the build — is it a repository secret (not a variable)?"
            fi
          done

      - name: Build the static site
        run: npm run build
        env:
          # The project site lives at /Knowledge-Vault/. Drop this line if you move
          # to a custom domain or to a <user>.github.io repository served from /.
          BASE_PATH: /Knowledge-Vault
          # Build-time Firebase values. Missing secrets build fine; the AI features
          # then show the in-app setup notice, exactly like a local build without .env.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_CLOUD_MODEL: ${{ secrets.VITE_CLOUD_MODEL }}

      # Prerequisite, done once by hand: Settings → Pages → Source: GitHub Actions.
      # Creating the Pages site is an admin-only API call, which the workflow token
      # can never make, so this action can only read an existing site. If this step
      # fails with "Resource not accessible by integration", Pages is still off.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
